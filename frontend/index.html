<!DOCTYPE html>
<html lang="ro" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Matches the XXII deep-space canvas so the mobile browser chrome blends
         into the page instead of framing it with a white bar. -->
    <meta name="theme-color" content="#04050c" />

    <title>ElectroShop – Magazin de electronice</title>
    <meta
      name="description"
      content="ElectroShop – magazin online de electronice: telefoane, laptopuri, audio și accesorii la prețuri bune, cu livrare rapidă în toată țara."
    />
    <meta name="keywords" content="electronice, telefoane, laptopuri, casti, audio, accesorii, magazin online" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://electroshop-alpha.vercel.app/" />

    <!-- XXII Design System typography.
         Space Grotesk  → display / headings (geometric, technical)
         Inter Tight    → UI and body copy (tight, high information density)
         JetBrains Mono → numeric readouts (holographic timer, telemetry)
         Satoshi is named first in the Tailwind font stack so a self-hosted
         licence can be dropped in later without touching any component. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElectroShop" />
    <meta property="og:title" content="ElectroShop – Magazin de electronice" />
    <meta
      property="og:description"
      content="Telefoane, laptopuri, audio și accesorii la prețuri bune. Livrare rapidă."
    />
    <meta property="og:url" content="https://electroshop-alpha.vercel.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ElectroShop – Magazin de electronice" />
    <meta name="twitter:description" content="Telefoane, laptopuri, audio și accesorii la prețuri bune." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
